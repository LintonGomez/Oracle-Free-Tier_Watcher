name: Security and shell checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watcher-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck
      - name: Parse shell script
        run: bash -n src/oracle-free-tier-watcher.sh
      - name: ShellCheck
        run: shellcheck --severity=style src/oracle-free-tier-watcher.sh
      - name: Reject obvious secret material and real OCI identifiers
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='*.md'             '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|ocid1\.(tenancy|compartment|instance|subnet|image|vcn|volume|user)\.oc1\.[a-zA-Z0-9._-]{20,}|-----BEGIN.*PRIVATE KEY-----|AKIA[0-9A-Z]{16})' .; then
            echo "Potential secret or real OCI identifier found in tracked files." >&2
            exit 1
          fi
